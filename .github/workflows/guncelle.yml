name: Listeyi güncelle ve yayımla

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 1 * *"   # her ayın 1'i, 08:00 TSİ: bağlantı kontrolü
  workflow_dispatch:
    inputs:
      baglanti_kontrolu:
        description: "Bağlantı kontrolü de yapılsın mı?"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.yayin.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağlantı kontrolü
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.baglanti_kontrolu)
        run: python scripts/check_links.py

      - name: README ve JSON üret
        run: python scripts/build.py

      - name: Değişiklikleri kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data README.md reports
          if ! git diff --cached --quiet; then
            git commit -m "Güncelleme"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: yayin
        uses: actions/deploy-pages@v4
